name: pttbbs-backend-dev

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: always
    shm_size: 128mb
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345678}
      POSTGRES_USER: ${POSTGRES_USER:-ptt}
      POSTGRES_DB: ${POSTGRES_DB:-pttbbs-dev}
  redis:
    image: redis:8.10.2-alpine
    restart: always
    cpus: 1
    mem_limit: 1G
    mem_reservation: 1G
    ports:
      - "127.0.0.1:6379:6379"
  postfix:
    image: chhsiao1981/docker-postfix:v0.2.0
    ports:
      - "127.0.0.1:2255:25"
    volumes:
      - type: bind
        source: ../docs/examples/var/mail
        target: /var/mail
      - type: bind
        source: ../docs/examples/etc/postfix-172.18
        target: /etc/postfix
