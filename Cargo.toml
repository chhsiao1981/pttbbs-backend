[workspace]
resolver = "3"
members = [
  "lemmy/crates/utils",
  "lemmy/crates/db_schema",
  "lemmy/crates/db_schema_file",
  "lemmy/crates/diesel_utils",
  "lemmy/crates/email",
  "lemmy/crates/db_views/private_message",
  "lemmy/crates/db_views/local_user",
  "lemmy/crates/db_views/local_image",
  "lemmy/crates/db_views/local_user_invite",
  "lemmy/crates/db_views/person",
  "lemmy/crates/db_views/post",
  "lemmy/crates/db_views/vote",
  "lemmy/crates/db_views/comment",
  "lemmy/crates/db_views/community",
  "lemmy/crates/db_views/community_moderator",
  "lemmy/crates/db_views/community_follower",
  "lemmy/crates/db_views/community_follower_approval",
  "lemmy/crates/db_views/custom_emoji",
  "lemmy/crates/db_views/notification",
  "lemmy/crates/db_views/notification_sql",
  "lemmy/crates/db_views/modlog",
  "lemmy/crates/db_views/person_content_combined",
  "lemmy/crates/db_views/person_saved_combined",
  "lemmy/crates/db_views/person_liked_combined",
  "lemmy/crates/db_views/post_comment_combined",
  "lemmy/crates/db_views/report_combined",
  "lemmy/crates/db_views/report_combined_sql",
  "lemmy/crates/db_views/site",
  "lemmy/crates/api/api",
  "lemmy/crates/api/api_crud",
  "lemmy/crates/api/api_common",
  "lemmy/crates/api/api_utils",
  "lemmy/crates/api/routes",
  "lemmy/crates/api/routes_v3",
  "lemmy/crates/apub/apub",
  "lemmy/crates/apub/activities",
  "lemmy/crates/apub/objects",
  "lemmy/crates/apub/send",
  "lemmy/crates/routes",
  "lemmy/crates/server",
  "crates/server",
]

[workspace.package]
version = "0.45.0"
edition = "2024"
description = "Lemmy for PTTBBS"
license = "AGPL-3.0"
homepage = "https://www.devptt.dev/"
documentation = "https://doc.devptt.dev"
repository = "https://github.com/Ptt-official-app/pttbbs-backend"
rust-version = "1.99"

[workspace.lints.clippy]
cast_lossless = "deny"
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "deny"
explicit_into_iter_loop = "deny"
explicit_iter_loop = "deny"
get_first = "deny"
implicit_clone = "deny"
indexing_slicing = "deny"
inefficient_to_string = "deny"
items_after_statements = "deny"
manual_string_new = "deny"
needless_collect = "deny"
perf = { level = "deny", priority = -1 }
redundant_closure_for_method_calls = "deny"
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
uninlined_format_args = "allow"
unused_self = "deny"
unwrap_used = "deny"
unimplemented = "deny"
unused_async = "deny"
map_err_ignore = "deny"
expect_used = "deny"
as_conversions = "deny"
large_futures = "deny"
tests_outside_test_module = "deny"
try_err = "deny"
unreachable = "deny"
string_slice = "deny"
same_name_method = "deny"
return_and_then = "deny"
ref_patterns = "deny"
redundant_type_annotations = "deny"
if_then_some_else_none = "deny"
allow_attributes = "deny"
unchecked_time_subtraction = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
pttbbs-server = { path = './crates/server' }
lemmy_api = { path = "./lemmy/crates/api/api" }
lemmy_api_crud = { path = "./lemmy/crates/api/api_crud" }
lemmy_api_routes = { path = "./lemmy/crates/api/routes" }
lemmy_api_routes_v3 = { path = "./lemmy/crates/api/routes_v3" }
lemmy_apub = { path = "./lemmy/crates/apub/apub" }
lemmy_apub_activities = { path = "./lemmy/crates/apub/activities" }
lemmy_apub_objects = { path = "./lemmy/crates/apub/objects" }
lemmy_utils = { path = "./lemmy/crates/utils", default-features = false }
lemmy_db_schema = { path = "./lemmy/crates/db_schema" }
lemmy_db_schema_file = { path = "./lemmy/crates/db_schema_file" }
lemmy_diesel_utils = { path = "./lemmy/crates/diesel_utils" }
lemmy_api_utils = { path = "./lemmy/crates/api/api_utils" }
lemmy_routes = { path = "./lemmy/crates/routes" }
lemmy_apub_send = { path = "./lemmy/crates/apub/send" }
lemmy_email = { path = "./lemmy/crates/email" }
lemmy_db_views_comment = { path = "./lemmy/crates/db_views/comment" }
lemmy_db_views_community = { path = "./lemmy/crates/db_views/community" }
lemmy_db_views_community_follower = { path = "./lemmy/crates/db_views/community_follower" }
lemmy_db_views_community_follower_approval = { path = "./lemmy/crates/db_views/community_follower_approval" }
lemmy_db_views_community_moderator = { path = "./lemmy/crates/db_views/community_moderator" }
lemmy_db_views_custom_emoji = { path = "./lemmy/crates/db_views/custom_emoji" }
lemmy_db_views_notification = { path = "./lemmy/crates/db_views/notification" }
lemmy_db_views_notification_sql = { path = "./lemmy/crates/db_views/notification_sql" }
lemmy_db_views_local_image = { path = "./lemmy/crates/db_views/local_image" }
lemmy_db_views_local_user = { path = "./lemmy/crates/db_views/local_user" }
lemmy_db_views_modlog = { path = "./lemmy/crates/db_views/modlog" }
lemmy_db_views_person = { path = "./lemmy/crates/db_views/person" }
lemmy_db_views_person_content_combined = { path = "./lemmy/crates/db_views/person_content_combined" }
lemmy_db_views_person_liked_combined = { path = "./lemmy/crates/db_views/person_liked_combined" }
lemmy_db_views_person_saved_combined = { path = "./lemmy/crates/db_views/person_saved_combined" }
lemmy_db_views_post_comment_combined = { path = "./lemmy/crates/db_views/post_comment_combined" }
lemmy_db_views_post = { path = "./lemmy/crates/db_views/post" }
lemmy_db_views_private_message = { path = "./lemmy/crates/db_views/private_message" }
