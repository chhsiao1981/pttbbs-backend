[workspace]
resolver = "3"
members = [
    "crates/server",
]

[workspace.package]
version = "0.45.0"
edition = "2024"
description = "Next-gen PTTBBS Backend. Implemented based on Lemmy."
license = "AGPL-3.0"
homepage = "https://github.com/Ptt-official-app/pttbbs-backend"
documentation = "https://doc.devptt.dev/"
repository = "https://github.com/Ptt-official-app/pttbbs-backend"
rust-version = "1.99"

[workspace.lints.clippy]
cast_lossless = "deny"
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "deny"
explicit_into_iter_loop = "deny"
explicit_iter_loop = "deny"
get_first = "deny"
implicit_clone = "deny"
indexing_slicing = "deny"
inefficient_to_string = "deny"
items_after_statements = "deny"
manual_string_new = "deny"
needless_collect = "deny"
perf = { level = "deny", priority = -1 }
redundant_closure_for_method_calls = "deny"
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
uninlined_format_args = "allow"
unused_self = "deny"
unwrap_used = "deny"
unimplemented = "deny"
unused_async = "deny"
map_err_ignore = "deny"
expect_used = "deny"
as_conversions = "deny"
large_futures = "deny"
tests_outside_test_module = "deny"
try_err = "deny"
unreachable = "deny"
string_slice = "deny"
same_name_method = "deny"
return_and_then = "deny"
ref_patterns = "deny"
redundant_type_annotations = "deny"
if_then_some_else_none = "deny"
allow_attributes = "deny"
unchecked_time_subtraction = "deny"
